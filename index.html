<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa 2026</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="favicon-copa-do-mundo.png">

</head>

<body>
    <section id="auth-screen" class="auth-container">
        <div class="auth-header">
            <h2>🏆 Bolão Copa 2026</h2>
            <p id="auth-subtitle">Faça login para palpitar!</p>
        </div>

        <div id="form-login" class="auth-form">
            <div class="input-group">
                <label for="email-login">E-mail</label>
                <input type="email" id="email-login" placeholder="Seu e-mail">
            </div>

            <div class="input-group">
                <label for="password-login">Senha</label>
                <input type="password" id="password-login" placeholder="Sua senha">
            </div>

            <button class="btn-primario" onclick="login()">Entrar no Bolão</button>
            <div class="divisor">ou</div>
            <button class="btn-secundario" onclick="alternarAuth('cadastro')">Criar Nova Conta</button>
        </div>

        <div id="form-cadastro" class="auth-form" style="display: none;">
            <div class="input-group">
                <label for="nome-cadastro">Nome Completo</label>
                <input type="text" id="nome-cadastro" placeholder="Como você quer ser chamado?">
            </div>

            <div class="input-group">
                <label for="email-cadastro">E-mail</label>
                <input type="email" id="email-cadastro" placeholder="Seu e-mail">
            </div>

            <div class="input-group">
                <label for="password-cadastro">Senha</label>
                <input type="password" id="password-cadastro" placeholder="Mínimo 6 caracteres">
            </div>

            <button class="btn-primario" onclick="cadastrar()">Cadastrar</button>
            <div class="divisor">ou</div>
            <button class="btn-secundario" onclick="alternarAuth('login')">Já tenho uma conta</button>
        </div>
    </section>

    <section id="dashboard" style="display: none;">
        <nav class="menu-navegacao">
            <div class="saudacao-usuario">Olá, <span id="nome-usuario-logado">...</span>!</div>

            <button id="btn-calendario" class="nav-btn" onclick="mostrarAba('calendario')">Jogos do Dia</button>
            <button id="btn-palpites" class="nav-btn ativo" onclick="mostrarAba('palpites')">Meus Palpites</button>
            <button id="btn-amigos" class="nav-btn" onclick="mostrarAba('amigos-palpites')">Palpites dos Amigos</button>
            <button id="btn-ranking" class="nav-btn" onclick="mostrarAba('ranking')">Ranking dos Amigos</button>
            <button id="btn-admin" class="nav-btn" onclick="mostrarAba('resultados-admin')">Resultados Reais</button>
            <button class="nav-btn btn-sair" onclick="logout()">Sair</button>
        </nav>

        <div id="resultados-admin" class="aba" style="display: none;">
            <h3>Atualizar Placares Oficiais da Copa</h3>
            <div id="lista-resultados-admin" class="grupos-container"></div>
        </div>

        <div id="palpites" class="aba">
            <h3>Jogos da Copa</h3>
            <div id="lista-jogos"></div>
        </div>

        <div id="ranking" class="aba" style="display: none;">
            <h3>Ranking</h3>
            <ul id="lista-ranking"></ul>
        </div>

        <div id="amigos-palpites" class="aba" style="display: none;">
            <h3>Palpites dos Amigos</h3>
            <select id="seletor-amigos" onchange="carregarPalpitesAmigo()">
                <option value="">Selecione um amigo...</option>
            </select>
            <div id="lista-palpites-amigo" class="grupos-container"></div>
        </div>
        
        <!-- NOVA ABA: CALENDÁRIO DE JOGOS -->
        <div id="calendario" class="aba" style="display: none;">
            <h3>Calendário da Copa</h3>
            <div id="lista-calendario"></div>
        </div>

    </section>

    <script src="app.js"></script>
</body>

</html>
